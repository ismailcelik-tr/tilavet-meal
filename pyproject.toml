[project]
name = "tilavet"
version = "0.1.0"
description = "Listen to Quran recitation, play the verified Turkish meal"
authors = [
    { name = "ismail çelik" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
audio = [
    "sounddevice>=0.5.6",
]
dev = [
    "pytest>=9.1.1",
]
hf = [
    "torch>=2.14.1",
    "transformers>=5.20.2",
]
mlx = [
    "mlx-whisper>=0.4.3",
]
nemo = [
    "nemo-toolkit[asr]>=3.0.0",
]
onnx = [
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "sherpa-onnx>=2.0.0",
]
piper = [
    "huggingface-hub>=2.3.0",
    "piper-tts==1.3.0",
]
